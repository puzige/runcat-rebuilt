name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build RunCat.app
        run: ./scripts/build.sh

      - name: Verify codesign
        run: codesign --verify --deep --strict RunCat.app

      - name: Smoke test binary
        run: file RunCat.app/Contents/MacOS/RunCat | grep -q arm64

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: RunCat-app
          path: RunCat.app

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build RunCat.app
        run: ./scripts/build.sh

      - name: Zip app bundle
        run: ditto -c -k --sequesterRsrc --keepParent RunCat.app "RunCat-${{ github.ref_name }}.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "RunCat-${{ github.ref_name }}.zip"
